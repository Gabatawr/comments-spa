# nginx для Angular SPA «Комментарии» (docs/API-v2.md §0).
# Один origin: статика + fallback на index.html, прокси /api/ и /ws в контейнер api:8080.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Вложения: изображения ≤ 5 МБ + multipart-оверхед.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # SPA fallback: любой клиентский маршрут отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker embedded DNS: разрешаем api:8080 лениво (на каждый запрос),
    # поэтому nginx стартует и не падает, даже если api ещё поднимается.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # REST API -> api:8080 (URI передаётся как есть).
    location ^~ /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # GraphQL (docs/API-v2.md §3.2): POST /graphql на том же origin.
    location = /graphql {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket /ws -> api:8080 с Upgrade/Connection (docs/API-v2.md §2.9).
    location ^~ /ws {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Хэшированные статические ресурсы Angular — долгий immutable-кэш.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: обновление SPA должно подхватываться сразу.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
